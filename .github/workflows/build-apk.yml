name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Read app version
        id: ver
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "Building Widgeter $VN (code $VC)"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK with its version
        run: cp app/build/outputs/apk/debug/app-debug.apk "widgeter-${{ steps.ver.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: widgeter-${{ steps.ver.outputs.name }}
          path: widgeter-${{ steps.ver.outputs.name }}.apk
          if-no-files-found: error

      - name: Publish a versioned Release
        if: github.ref == 'refs/heads/claude/android-home-widget-app-nulgfz'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Widgeter ${{ steps.ver.outputs.name }}
          body: |
            **Widgeter ${{ steps.ver.outputs.name }}** (version code ${{ steps.ver.outputs.code }})

            An Android app with seven home-screen widgets: Clock, Note, Counter,
            To-do, Habit/streak, Water tracker, and Countdown — plus a Material 3
            app with dark mode, per-widget setup, and a settings screen.

            **Install on your phone**
            1. Tap **widgeter-${{ steps.ver.outputs.name }}.apk** below to download it.
            2. Open the downloaded file; when asked, allow installing from this
               source, then tap Install.
            3. Long-press your home screen → Widgets → Widgeter → add any widget.

            Debug-signed build, intended for personal sideloading. Installs as an
            update over previous versions and keeps your data.
          files: widgeter-${{ steps.ver.outputs.name }}.apk
